[project]
name = "sanopy"
version = "0.2.2"
description = "A CLI tool for improving the code quality of Python projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Leodanis Pozo Ramos", email = "lpozor78@gmail.com" },
]
keywords = ["linter", "code-quality", "automation", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.3.1",
    "rich>=14.3.3",
]

[project.optional-dependencies]
ruff = ["ruff>=0.15.8"]
pylint = ["pylint>=4.0.5"]
bandit = ["bandit>=1.9.4"]
mypy = ["mypy>=1.19.1"]
pyright = ["pyright>=1.1.408"]
semgrep = ["semgrep>=1.86.0"]
vulture = ["vulture>=2.16"]
radon = ["radon>=6.0.1"]
safety = ["safety>=3.7.0"]
pip-audit = ["pip-audit>=2.10.1"]
all = [
    "sanopy[ruff,pylint,bandit,mypy,pyright,semgrep,vulture,radon,safety,pip-audit]",
]

[project.urls]
Homepage = "https://github.com/lpozo/sanopy"
Repository = "https://github.com/lpozo/sanopy.git"
Issues = "https://github.com/lpozo/sanopy/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.3.1",
    "responses>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sanopy = "sanopy.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail any single test that hangs rather than blocking the whole suite.
timeout = 60

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.pylint.messages_control]
disable = [
    "duplicate-code",
    "too-many-locals",
    # Test-file relaxations. Tests routinely re-bound names (W0621), import
    # fixtures at module top (C0415), use loose parameter counts (R0913,
    # R0917), and prefer concise helpers (C0116, W0612, W0613).
    "C0415",
    "W0621",
    "W0612",
    "W0613",
    "C0116",
    "R0913",
    "R0917",
]

[tool.vulture]
ignore_decorators = ["@main.command", "@click.command", "@click.group"]
ignore_names = [
    "_mock_get_context",
    "_mock_scan_config",
    "_use_mock_scan_config",
    "_isolate_materialized_dirs",
    "mock_scan_config",
    "BanditLinter",
    "MyPyLinter",
    "PipAuditLinter",
    "PylintLinter",
    "PyrightLinter",
    "RadonLinter",
    "RuffLinter",
    "SafetyLinter",
    "SemgrepLinter",
    "VultureLinter",
    "build_command",
    "format",
    "from_dict",
    "module_name",
    "output",
    "package_name",
    "parse_output",
    "succeeded",
    "process_result",
    "scan_project",
    "snippet_start_line",
    "semantic_context",
    "target_config",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
