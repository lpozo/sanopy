name: Sanopy Self-Scan

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan codebase with latest Sanopy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install latest Sanopy
        run: python -m pip install --upgrade 'sanopy[all]'

      - name: Scan codebase
        run: sanopy scan src tests --skip safety,pip-audit
